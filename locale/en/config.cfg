[mod-setting-name]
hivemind_enable_logging=Enable Hivemind debug logging
hivemind_attack_event_retention_ticks=Attack event retention (ticks)

[mod-setting-description]
hivemind_enable_logging=If enabled, Hivemind will write debug logs to the Factorio console (visible with F4/F5 or in headless server output).
hivemind_attack_event_retention_ticks=The number of game ticks to retain attack event data before pruning. Lower values are more memory efficient; higher values allow longer data retention. Default: 36000 (10 minutes at 60 UPS).
